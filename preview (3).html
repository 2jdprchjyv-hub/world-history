 '<div id="fold-'+g+'" class="fold '+(open?'open':'')+'" '+(open?'':'inert')+'><div class="foldinner"><div class="foldcontent">'+
 '<div class="row"><span></span><button class="subtle" data-group="'+g+'">この章を全選択／解除</button></div>'+
 '<div class="detail">'+cs.map(c=>'<button data-section="'+c+'" aria-pressed="'+selected.has(c)+'" class="'+(selected.has(c)?'on':'')+'"><span>第'+(c+1)+'部</span><span>'+names[c]+'</span><small>'+bank.filter(f=>f.c===c).length+'問</small></button>').join('')+
 '</div></div></div></div></div>';
}
function toggleChapter(g){
 branch=branch===g?null:g;
 for(const button of document.querySelectorAll('[data-branch]')){
  const open=Number(button.dataset.branch)===branch;
  button.setAttribute('aria-expanded',String(open));
  button.classList.toggle('expanded',open);
  const panel=document.getElementById('fold-'+button.dataset.branch);
  panel.classList.toggle('open',open);panel.inert=!open;
 }
}
function home(){
 return '<section class="panel" style="margin-top:0">'+
 '<div class="row" style="margin-bottom:18px"><h3 style="margin:0">教科書の章</h3><button class="subtle" data-all>全範囲を選択</button></div>'+
 '<div class="chapters">'+Object.entries(groups).map(([g,cs])=>chapterHTML(g,cs)).join('')+'</div>'+
 '<div class="countline">'+selected.size+'部を選択中 <button class="subtle" data-clear>選択解除</button></div>'+
 '<p class="muted">理解度＝その章の完了問題数 ÷ 全問題数</p>'+
 '<h3>分野・地域で絞る</h3><div class="wrap chips"><button data-tag="" class="'+(!tags.size?'on':'')+'">すべて</button>'+
 fields.map(t=>'<button data-tag="'+t+'" class="'+(tags.has(t)?'on':'')+'">'+t+'</button>').join('')+'</div>'+
 '<p class="muted">章の範囲内で、選んだ分野・地域のいずれかを含む問題。</p>'+
 countUI()+
 '<div class="bottom"><span class="muted">対象 '+pool().length+'問<br>未出題を優先・重複なし</span><button class="primary" id="start" data-start>出題を始める →</button></div></section>';
}
function quiz(){
 const s=session,q=s.queue[s.index],r=s.results[s.index];
 return '<div class="progress"><i style="width:'+100*s.index/s.queue.length+'%"></i></div>'+
 '<div class="row"><span class="muted">QUESTION '+(s.index+1)+' / '+s.queue.length+'</span><span class="badge">'+(q.n===2?'2つ選択':'1つ選択')+'</span></div>'+
 '<p class="muted">第'+(q.c+1)+'部 · '+names[q.c]+' ／ 教科書 pp.'+pages[q.c]+'</p>'+
 '<section class="panel"><div class="prompt">'+esc(q.prompt)+'</div>'+
 (r?'<div aria-live="polite"><div class="feedback '+(r.ok?'goodtext':'badtext')+'">'+(r.ok?'正解':r.unknown?'わからない':'不正解')+'</div>'+
 '<div class="answer"><strong>正解</strong>'+q.options.filter(o=>o.ok).map(o=>'<p>'+esc(o.text)+'</p>').join('')+'</div>'+
 '<h3>説明</h3><p style="white-space:pre-line">'+esc(q.explain)+'</p></div>':
 '<div class="muted" style="margin-bottom:12px">'+q.n+'つ選ぶと自動で採点します'+(q.n===2?'。選択済みの項目は再タップで解除できます。':'。')+'</div>'+
 '<div class="options">'+q.options.map((o,i)=>'<button class="option '+(s.selected.has(i)?'on':'')+'" data-choice="'+i+'" aria-pressed="'+s.selected.has(i)+'"><span class="letter">'+'ABCD'[i]+'</span><span>'+esc(o.text)+'</span></button>').join('')+'</div>')+
 '<div class="bottom"><button data-unknown>わからない</button>'+
 (r?'<button class="primary" data-next>'+(s.index+1===s.queue.length?'結果を見る':'次の問題 →')+'</button>':'<span class="muted">'+s.selected.size+' / '+q.n+' 選択</span>')+'</div></section>';
}
function listRows(items){
 return items.length?items.map(f=>'<details class="listitem"><summary>'+esc(f.term)+' <span class="muted">第'+(f.c+1)+'部</span></summary><p>'+esc(f.desc||f.seq.join(' → '))+'</p><span class="muted">教科書 pp.'+pages[f.c]+'</span></details>').join(''):'<div class="empty">該当する項目はありません。</div>';
}
function list(){
 const status=view==='todo'?'todo':'done';
 const items=ids(status).filter(f=>(f.term+' '+(f.desc||'')).includes(search));
 return '<div class="row"><h2>'+(status==='todo'?'未完了':'完了')+'</h2><span class="muted">'+ids(status).length+'項目</span></div>'+
 '<p class="muted">'+(status==='todo'?'間違えた問題・わからなかった問題をまとめて復習。':'正解した項目。再出題では対応関係なども確認します。')+'</p>'+
 '<section class="panel"><input class="search" id="search" value="'+esc(search)+'" placeholder="用語を検索" aria-label="用語を検索">'+
 '<div id="listitems">'+listRows(items)+'</div>'+
 (status==='todo'?countUI()+'<div class="bottom"><span></span><button class="primary" id="start" data-review>未完了だけで出題 →</button></div>':'')+'</section>';
}
function finish(){
 const correct=session.results.filter(r=>r?.ok).length;
 return '<div class="muted">SESSION COMPLETE</div><h2>今回の結果</h2><section class="panel"><div class="score"><strong>'+correct+'</strong><small>/ '+session.queue.length+'問 正解</small></div>'+
 '<p>正答率 '+Math.round(100*correct/session.queue.length)+'%</p>'+
 '<div class="bottom"><button data-nav="todo">未完了を見る</button><button class="primary" data-nav="home">ホームへ →</button></div></section>';
}
function syncCount(){
 const review=view==='todo',n=review?ids('todo').length:pool().length;
 const el=document.getElementById('start'),note=document.getElementById('countnote');
 const actual=valid()?Math.min(Number(amount),n):0;
 if(el){
  el.disabled=!valid()||!n;
  el.textContent=review?'未完了 '+actual+'問を出題 →':actual+'問を始める →';
 }
 if(note)note.textContent=!valid()?'1〜1000の整数を入力してください。':
 !n?'対象の問題がありません。':
 Number(amount)>n?'対象問題数に合わせて'+n+'問で出題します。重複はありません。':
 custom?'1〜1000問で設定できます。':'';
}
function render(){
 const active=session&&(view==='quiz'||view==='finish');
 document.getElementById('app').innerHTML='<div class="app"><aside><h1>世界史試験対策</h1>'+
 (active?'<div class="score"><div class="muted">正答数</div><strong>'+session.results.filter(r=>r?.ok).length+'</strong><small>/ '+session.queue.length+'</small></div>'+
 '<div class="rail">'+session.queue.map((q,i)=>'<button data-jump="'+i+'" '+(session.results[i]||i===session.index?'':'disabled')+' class="'+(i===session.index?'current ':'')+(session.results[i]?(session.results[i].ok?'good':'bad'):'')+'">'+(i+1)+'</button>').join('')+'</div>':'')+
 '<nav><button data-nav="home" class="'+(view==='home'?'on':'')+'">ホーム<span>›</span></button>'+
 '<button data-nav="todo" class="'+(view==='todo'?'on':'')+'">未完了<span>'+ids('todo').length+'</span></button>'+
 '<button data-nav="done" class="'+(view==='done'?'on':'')+'">完了<span>'+ids('done').length+'</span></button></nav>'+
 (session&&!active?'<button class="subtle" data-resume style="margin-top:18px">学習に戻る →</button>':'')+
 '</aside><main>'+(view==='home'?home():view==='quiz'?quiz():view==='finish'?finish():list())+
 sourceLink()+'<footer>出題・解説は提供資料に基づきます。進捗はこのブラウザに保存。'+
 (!storageOK?' この画面では保存を利用できないため、進捗は今回の表示中のみ保持されます。':'')+'</footer></main></div>';
 syncCount();
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 const d=b.dataset;
 if('nav'in d){view=d.nav;search=''}
 else if('resume'in d)view='quiz';
 else if('branch'in d){toggleChapter(+d.branch);return}
 else if('all'in d)selected=new Set(names.map((_,i)=>i));
 else if('clear'in d)selected.clear();
 else if('group'in d){
  const cs=groups[d.group],all=cs.every(c=>selected.has(c));
  cs.forEach(c=>all?selected.delete(c):selected.add(c));
 }
 else if('section'in d){
  const c=+d.section;selected.has(c)?selected.delete(c):selected.add(c);
 }
 else if('tag'in d){
  const t=d.tag;if(!t)tags.clear();else tags.has(t)?tags.delete(t):tags.add(t);
 }
 else if('count'in d){amount=d.count;custom=false}
 else if('custom'in d)custom=true;
 else if('start'in d){start();return}
 else if('review'in d){start('review');return}
 else if('choice'in d){choose(+d.choice);return}
 else if('unknown'in d){grade(true);return}
 else if('next'in d){next();return}
 else if('jump'in d){session.index=+d.jump;session.selected=new Set();view='quiz'}
 render();
});
document.addEventListener('input',e=>{
 if(e.target.id==='amount'){amount=e.target.value;syncCount()}
 if(e.target.id==='search'){
  search=e.target.value;
  document.getElementById('listitems').innerHTML=listRows(ids(view).filter(f=>(f.term+' '+(f.desc||'')).includes(search)));
 }
});
save();render();
</script>
</html>
